version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridsense-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gridsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-api:
    build:
      context: ./gridsense-ml
      dockerfile: Dockerfile
    container_name: gridsense-ml
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  backend:
    build:
      context: ./gridsense-backend
      dockerfile: Dockerfile
    container_name: gridsense-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/gridsense?schema=public
      - JWT_SECRET=gridsense_enterprise_super_secret_jwt_key_2026
      - ML_API_URL=http://ml-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-api:
        condition: service_started

  frontend:
    build:
      context: ./gridsense-frontend
      dockerfile: Dockerfile
    container_name: gridsense-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
